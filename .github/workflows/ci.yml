name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v7
        with:
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # The worker has no test suite; a dry-run deploy type-checks and bundles
      # src/index.ts against wrangler.toml without needing Cloudflare creds.
      - run: npx wrangler deploy --dry-run
