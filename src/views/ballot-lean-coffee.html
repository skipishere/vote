<div class="ballot" id="ballot-lean-coffee">
  <button class="ballot-option up" id="lc-option-up" data-value="up" accesskey="1">
    <div>👍</div>
    <div id="lc-count-up">0</div>
    <div>Continue</div>
  </button>
  <button class="ballot-option neutral" id="lc-option-neutral" data-value="neutral" accesskey="2">
    <div>✊</div>
    <div id="lc-count-neutral">0</div>
    <div>Either way</div>
  </button>
  <button class="ballot-option down" id="lc-option-down" data-value="down" accesskey="3">
    <div>👎</div>
    <div id="lc-count-down">0</div>
    <div>Move on</div>
  </button>
</div>
