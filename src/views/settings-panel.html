<dialog id="settings-dialog" class="modal-card" aria-labelledby="settings-title">
  <div class="settings-header">
    <span id="settings-title">Settings</span>
    <button id="settings-close-btn" class="btn-sm" aria-label="Close settings">✕</button>
  </div>
  <label class="settings-row">
    <span>Sound alert when timer ends</span>
    <input type="checkbox" id="siren-enabled" />
  </label>
</dialog>
