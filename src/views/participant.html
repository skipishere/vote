<button id="settings-btn" class="settings-btn-icon" title="Settings" aria-label="Open settings"></button>
<div class="page">
  <div class="view-container">
    <div class="view-header">
      <div class="logo" id="logo-text">🗳️ Remote Vote</div>
      <div class="view-header-actions">
        <span id="conn-status" class="status-chip status-connecting"><span></span>Connecting…</span>
        <button id="leave-btn" class="btn-danger btn-sm">Leave</button>
      </div>
    </div>
  </div>

  <div id="error-msg" class="error-msg" hidden></div>

  <div id="gate-view">
    <div class="card">
      <h2>Join <span class="code-mono" id="room-code-display"></span></h2>
      <div class="form-group">
        <label for="name-input">Your name</label>
        <input id="name-input" type="text" placeholder="Display name" maxlength="40" autocomplete="name" />
      </div>
      <button id="join-btn" class="btn-primary btn-full">Join</button>
    </div>
  </div>

  <div id="participant-view" class="view-container focus-target" tabindex="-1" hidden>
    
    <div id="waiting-view" class="topic-box view-container">
      <span>⏳ Waiting for host to start the vote…</span>
    </div>

    <div id="voting-view" class="view-container focus-target" tabindex="-1" hidden>
      <div class="topic-box">
        <span id="topic">No topic set</span>
      </div>
      <div class="section-label" id="voted-count">0 of 0 voted</div>
      <div id="ballot-slot"></div>
      <div id="timer-slot"></div>
      <div id="lock-banner" class="voting-status"></div>
    </div>
  </div>
</div>
