<div class="page page-centered">
  <div class="logo">☕ Lean Coffee Vote</div>
  <div class="card">
    <div class="form-group">
      <label for="name-input">Your name</label>
      <input id="name-input" type="text" placeholder="Display name" maxlength="40" autocomplete="nickname" />
    </div>

    <div class="tabs">
      <button class="active" data-tab="join">Join a vote</button>
      <button data-tab="create">Host a vote</button>
    </div>

    <div class="tab-panels">
      <div id="panel-create" class="tab-panel">
        <button id="create-btn" class="btn-primary btn-full">Create vote</button>
      </div>

      <div id="panel-join" class="tab-panel active">
        <div class="form-group">
          <label for="code-input">Room code</label>
          <input id="code-input" type="text" placeholder="e.g. ABC123" maxlength="6"
            autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />
        </div>
        <button id="join-btn" class="btn-primary btn-full">Enter room</button>
      </div>
    </div>

    <div id="error-msg" class="error-msg mt-sm" hidden></div>
  </div>
</div>
