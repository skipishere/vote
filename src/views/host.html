<div class="page">
  <div class="view-container">

    <div class="view-header">
      <div class="logo" id="logo-text">🗳️ Remote Vote</div>
      <div class="view-header-actions">
        <span class="room-code-badge"></span>
        <button id="copy-code-btn" class="btn-sm">Copy code</button>
        <button id="copy-link-btn" class="btn-sm">Copy link</button>
        <span id="conn-status" class="status-chip status-connecting"><span></span>Starting…</span>
        <button id="lock-meeting-btn" class="btn-sm">🔒 Lock</button>
        <button id="end-meeting-btn" class="btn-danger btn-sm">End meeting</button>
      </div>
    </div>

    <div id="error-msg" class="error-msg" hidden></div>

    <div id="topic-display" class="topic-box" hidden>
      <span id="topic">No topic set</span>
    </div>

    <div class="host-grid">

      <!-- Left: phase-dependent content -->
      <div>

        <!-- SETUP PANEL -->
        <div id="setup-panel" class="panel">
          <div class="section-label">Topic</div>
          <input id="topic-input" type="text" placeholder="What are we discussing? (optional)" maxlength="120" />

          <hr />

          <div class="section-label">Timer</div>
          <div class="timer-options">
            <button class="btn-sm btn-selected" data-preset="none">No timer</button>
            <button class="btn-sm" data-preset="60">1m</button>
            <button class="btn-sm" data-preset="120">2m</button>
            <button class="btn-sm" data-preset="300">5m</button>
            <input id="timer-custom" type="number" min="5" max="600" placeholder="Custom" />
            <span>sec</span>
          </div>

          <hr />

          <div class="section-label">Results</div>
          <div class="radio-group">
            <label>
              <input type="radio" name="results-visibility" value="show" checked />
              Show to participants
            </label>
            <label>
              <input type="radio" name="results-visibility" value="hide" />
              Hide until vote ends
            </label>
          </div>

          <hr />

          <div class="section-label">Vote type</div>
          <div class="radio-group" id="vote-type-options">
            <!-- Populated from VOTE_TYPES registry -->
          </div>

          <hr />

          <div class="controls-row">
            <button id="start-btn" class="btn-primary">▶ Start vote</button>
          </div>
        </div>

        <!-- ACTIVE PANEL -->
        <div id="active-panel" hidden>

          <div id="ballot-slot"></div>

          <div id="voting-status" class="voting-status"></div>

          <div id="timer-slot"></div>

          <div class="controls-row">
            <button id="end-vote-btn">End vote</button>
            <button id="new-round-btn" hidden>↺ New round</button>
            <button id="reset-timer-btn" hidden>⏱ Reset timer</button>
          </div>

          <div id="reset-timer-form" hidden>
            <div class="section-label">Set timer duration</div>
            <div class="timer-options">
              <button class="btn-sm btn-selected" data-reset-preset="60">1m</button>
              <button class="btn-sm" data-reset-preset="120">2m</button>
              <button class="btn-sm" data-reset-preset="300">5m</button>
              <input id="reset-timer-custom" type="number" min="5" max="600" placeholder="Custom" />
              <span>sec</span>
              <button id="reset-timer-confirm-btn" class="btn-primary btn-sm">▶ Go</button>
            </div>
          </div>

        </div>
      </div>

      <!-- Right: participants (always visible) -->
      <div class="panel">
        <div class="section-label">Participants</div>
        <div id="voted-summary"></div>
        <ul id="participant-list"></ul>
      </div>

    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal-card">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel-btn">Cancel</button>
        <button id="modal-confirm-btn" class="btn-danger">Confirm</button>
      </div>
    </div>
  </div>

</div>
